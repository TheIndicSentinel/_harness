name: Test harness hooks

# Regression coverage for the harness's own hook logic (gate_lib, release_gate,
# secrets_guard, budget_lib, the CI gate-check template) — added after a
# sibling-folder path-prefix bug shipped once already and was only caught by
# manual testing. Runs on every push/PR so a future change to this logic gets
# checked automatically instead of relying on manual re-verification.

on:
  push:
  pull_request:

jobs:
  test:
    # macOS too: the harness is developed on a Mac, and git/path behavior differs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commit SHA, not a floating tag (a tag can be moved; a SHA
      # can't). Verified via `gh api repos/actions/checkout/git/refs/tags/v4.3.1`
      # -- update by re-running that for a newer tag, don't hand-edit the SHA.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12' # pinned, not '3.x' -- a silent major-version jump shouldn't change CI behavior

      - name: Configure git identity (needed by tests that create commits)
        run: |
          git config --global user.email "harness-ci@example.com"
          git config --global user.name "harness-ci"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  plugin-validate:
    # Informational: validates the plugin/marketplace manifests with a pinned
    # Claude Code release. continue-on-error so a CLI change or npm outage
    # doesn't turn the commit red; look at it when updating Claude Code
    # (docs/COMPATIBILITY.md).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: Validate marketplace manifest
        run: claude plugin validate .
      - name: Validate plugin manifest and hooks
        run: claude plugin validate .claude-plugin/plugin.json
